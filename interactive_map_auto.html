<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Welcoming Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  body, html { margin: 0; padding: 0; height: 100%; }
  #map { width: 100%; height: 100%; }

  #searchBox {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: white;
    padding: 6px;
    border-radius: 6px;
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
  }

  #filters {
    position: absolute;
    top: 60px;
    left: 10px;
    z-index: 9999;
    background: white;
    padding: 8px;
    border-radius: 6px;
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
  }

  .filter-btn {
    margin: 3px;
    padding: 4px 6px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background: #eee;
  }

  .filter-btn.active {
    background: #ccc;
  }
</style>
</head>

<body>

<div id="searchBox">
  <input id="lgaSearch" type="text" placeholder="Search LGA…" style="width:220px;">
  <button onclick="searchLGA()">Search</button>
</div>

<div id="filters">
  <button class="filter-btn active" data-type="all">All</button>
  <button class="filter-btn" data-type="workplace">Workplaces</button>
  <button class="filter-btn" data-type="club">Clubs</button>
  <button class="filter-btn" data-type="council">Councils</button>
  <button class="filter-btn" data-type="university">Universities</button>
</div>

<div id="map"></div>

<script>
/////////////////////////////
// MAP SETUP
/////////////////////////////

var map = L.map('map').setView([-25.5, 134], 4.5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

/////////////////////////////
// COLOURS PER CATEGORY
/////////////////////////////

const colours = {
  workplace: "#0074D9",
  club: "#2ECC40",
  council: "#FF851B",
  university: "#C44444"   // your chosen uni colour
};

/////////////////////////////
// MARKER CLUSTER (neutral)
/////////////////////////////

var clusterGroup = L.markerClusterGroup({
  iconCreateFunction: function (cluster) {
    return new L.DivIcon({
      html: '<div style="background:#888;color:white;border-radius:50%;width:35px;height:35px;display:flex;align-items:center;justify-content:center;">' + cluster.getChildCount() + '</div>',
      className: 'neutral-cluster',
      iconSize: [35,35]
    });
  }
});
map.addLayer(clusterGroup);

/////////////////////////////
// LOAD LGA POLYGONS
/////////////////////////////

var lgaLayer;
var lgaLookup = {};

fetch("https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/refs/heads/main/LGA_2025_AUST_GDA2020.min.json")
  .then(res => res.json())
  .then(data => {
    lgaLayer = L.geoJSON(data, {
      style: { color: "#666", weight: 1, fillOpacity: 0.05 },
      onEachFeature: function (feature, layer) {
        const name = feature.properties.LGA_NAME || "";
        if (name) lgaLookup[name.toLowerCase()] = layer;
      }
    }).addTo(map);
  });

function searchLGA() {
  const input = document.getElementById("lgaSearch").value.trim().toLowerCase();
  if (lgaLookup[input]) {
    map.fitBounds(lgaLookup[input].getBounds());
  } else {
    alert("LGA not found.");
  }
}

/////////////////////////////
// LOAD POINTS & FILTER LOGIC
/////////////////////////////

let allMarkers = [];

Papa.parse("https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/refs/heads/main/welcoming_points_centroids.csv", {
  download: true,
  header: true,
  complete: function (results) {
    results.data.forEach(row => {
      if (!row.lat || !row.lon) return;

      const type = row.type ? row.type.toLowerCase() : "workplace";
      const color = colours[type] || "#888";

      const marker = L.circleMarker([parseFloat(row.lat), parseFloat(row.lon)], {
        radius: 7,
        fillColor: color,
        color: "#000",
        weight: 1,
        fillOpacity: 0.9
      }).bindPopup(`<b>${row.name}</b><br>${row.address}<br>${row.type}`);

      marker.category = type;
      allMarkers.push(marker);
      clusterGroup.addLayer(marker);
    });
  }
});

/////////////////////////////
// FILTER BUTTONS
/////////////////////////////

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    const filterType = btn.dataset.type;

    clusterGroup.clearLayers();

    if (filterType === "all") {
      allMarkers.forEach(m => clusterGroup.addLayer(m));
    } else {
      allMarkers
        .filter(m => m.category === filterType)
        .forEach(m => clusterGroup.addLayer(m));
    }
  });
});

</script>
</body>
</html>
