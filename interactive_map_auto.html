<script>
  // ---------------------------------------------------
  // 1. DATA SOURCES (GitHub raw file URLs)
  // ---------------------------------------------------
  const GEOJSON_URL =
    "https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/refs/heads/main/LGA_2025_AUST_GDA2020.min.json";

  const POINTS_URL =
    "https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/refs/heads/main/welcoming_points_centroids.csv";

  const WELC_LGAS_URL =
    "https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/refs/heads/main/welcoming_lgas.csv";

  // ---------------------------------------------------
  // 2. MAP SETUP
  // ---------------------------------------------------
  var map = L.map("map").setView([-25.0, 134.0], 4);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  var markerCluster = L.markerClusterGroup();

  // ---------------------------------------------------
  // 3. Utility: Strip BOM (GitHub CSV bug fix)
  // ---------------------------------------------------
  function stripBOM(text) {
    return text.replace(/^\uFEFF/, "");
  }

  // ---------------------------------------------------
  // 4. LOAD WELCOMING LGAs CSV
  // ---------------------------------------------------
  var welcomingLGAs = new Set();

  fetch(WELC_LGAS_URL)
    .then(response => response.text())
    .then(text => {
      text = stripBOM(text);
      let parsed = Papa.parse(text, { header: true }).data;

      parsed.forEach(row => {
        if (row.lga_name) {
          welcomingLGAs.add(row.lga_name.trim());
        }
      });

      loadGeoJSON(); // Continue AFTER LGAs loaded
    });

  // ---------------------------------------------------
  // 5. LOAD GEOJSON & STYLE LGAs
  // ---------------------------------------------------
  function loadGeoJSON() {
    fetch(GEOJSON_URL)
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          style: function (feature) {
            let name = feature.properties.LGA_NAME25;

            if (welcomingLGAs.has(name)) {
              return {
                fillColor: "#66b2ff",
                color: "#004c99",
                weight: 1,
                fillOpacity: 0.45
              };
            }

            return {
              fillColor: "#e0e0e0",
              color: "#999999",
              weight: 0.3,
              fillOpacity: 0.10
            };
          },
          onEachFeature: function (feature, layer) {
            layer.bindTooltip("LGA: " + feature.properties.LGA_NAME25);
          }
        }).addTo(map);

        loadPoints(); // Continue AFTER LGA polygons added
      });
  }

  // ---------------------------------------------------
  // 6. LOAD POINTS CSV & ADD MARKERS
  // ---------------------------------------------------
  function loadPoints() {
    fetch(POINTS_URL)
      .then(response => response.text())
      .then(text => {
        text = stripBOM(text);
        let rows = Papa.parse(text, { header: true }).data;

        rows.forEach(row => {
          if (!row.lat || !row.lon) return;

          let type = (row.type || "").trim().toLowerCase();

          // Map CSV "type" → FontAwesome icon
          const iconMap = {
            "uni": "fa-university",
            "workplace": "fa-building",
            "club": "fa-flag",
            "cop": "fa-users"
          };

          let iconName = iconMap[type] || "fa-map-marker";

          let marker = L.marker([row.lat, row.lon], {
            icon: L.divIcon({
              className: "custom-icon",
              html: `<i class="fa ${iconName}" style="color:purple; font-size:20px;"></i>`
            })
          });

          marker.bindPopup(
            `<b>${row.name}</b><br>${row.address}<br>${row.postcode}`
          );

          markerCluster.addLayer(marker);
        });

        map.addLayer(markerCluster);
      });
  }
</script>
