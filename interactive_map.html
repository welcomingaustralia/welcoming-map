<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Welcoming Map – Auto-updating</title>

  <!-- Leaflet core -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster for decluttering markers -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Font Awesome for icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
  />

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }

    /* LGA search box */
    #lgaSearchBox {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: white;
      border-radius: 4px;
      border: 1px solid #ccc;
      padding: 6px 8px;
      font-size: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    #lgaSearchBox input {
      border: none;
      outline: none;
      width: 220px;
      font-size: 14px;
    }

    .legend {
      background-color: white;
      padding: 15px;
      border: 2px solid #bbb;
      border-radius: 8px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      font-size: 14px;
      line-height: 1.4;
    }
    .legend i {
      min-width: 18px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- LGA search UI -->
  <div id="lgaSearchBox">
    <input id="lgaSearch" type="text" placeholder="Search LGA (min 3 letters)…">
  </div>

  <div id="map"></div>

<script>
// -----------------------------------
// 1. DATA SOURCES
// -----------------------------------
const GEOJSON_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/main/LGA_2025_AUST_GDA2020.min.json";
const POINTS_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/main/welcoming_points_centroids.csv";
const WELC_LGAS_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/main/welcoming_lgas.csv";

// -----------------------------------
// 2. MAP SETUP
// -----------------------------------
const map = L.map("map").setView([-25.0, 134.0], 5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18
}).addTo(map);

// Cluster tuning: decluster earlier
const clusterOptions = {
  maxClusterRadius: 40,
  disableClusteringAtZoom: 9
};

const uniCluster       = L.markerClusterGroup(clusterOptions);
const workplaceCluster = L.markerClusterGroup(clusterOptions);
const clubCluster      = L.markerClusterGroup(clusterOptions);
const copCluster       = L.markerClusterGroup(clusterOptions);

// Neutral colour cluster CSS
document.head.insertAdjacentHTML("beforeend", `
<style>
.marker-cluster-small {
  background: #9bbad1;
  color: white;
}
.marker-cluster-medium {
  background: #7896b5;
  color: white;
}
.marker-cluster-large {
  background: #4f6d8a;
  color: white;
}
</style>`);

// -----------------------------------
// CSV helper
// -----------------------------------
function loadCSV(url) {
  return fetch(url)
    .then(r => r.text())
    .then(t => Papa.parse(t, { header: true, skipEmptyLines: true }).data);
}

// LGA storage for search
const lgaLayers = {};

Promise.all([
  loadCSV(WELC_LGAS_URL),
  fetch(GEOJSON_URL).then(r => r.json()),
  loadCSV(POINTS_URL)
])
.then(([welcList, geojson, points]) => {

  // 3. Welcoming LGAs
  const welcomingLGAs = new Set(
    welcList.map(r => r.lga_name?.trim()).filter(Boolean)
  );

  // 4. LGA polygons
  function lgaStyle(feature) {
    const name = feature.properties.LGA_NAME25;
    return welcomingLGAs.has(name)
      ? { fillColor: "#66b2ff", color: "#004c99", weight: 1, fillOpacity: 0.45 }
      : { fillColor: "#e0e0e0", color: "#999", weight: 0.3, fillOpacity: 0.1 };
  }

  L.geoJSON(geojson, {
    style: lgaStyle,
    onEachFeature: (feature, layer) => {
      const name = feature.properties.LGA_NAME25;
      lgaLayers[name.toLowerCase()] = layer;
      layer.bindTooltip(name);
    }
  }).addTo(map);

  // 5. POINT MARKERS
  const iconMap = {
    uni:       { icon: "fa-university", color: "#C44444" },
    workplace: { icon: "fa-building",   color: "#2E8B57" },
    club:      { icon: "fa-flag",       color: "#800080" },
    cop:       { icon: "fa-users",      color: "#ff8800" }
  };

  points.forEach(r => {
    if (!r.lat || !r.lon) return;

    const type = r.type?.trim().toLowerCase();
    const cfg = iconMap[type] || { icon: "fa-map-marker", color: "#444" };

    const marker = L.marker([+r.lat, +r.lon], {
      icon: L.divIcon({
        className: "fa-icon",
        html: `<i class="fa ${cfg.icon}" style="color:${cfg.color}; font-size:20px;"></i>`,
        iconSize: [20, 20]
      })
    });

    marker.bindPopup(`<b>${r.name}</b><br>${r.address}<br>${r.state} ${r.postcode}`);

    if (type === "uni")       uniCluster.addLayer(marker);
    if (type === "workplace") workplaceCluster.addLayer(marker);
    if (type === "club")      clubCluster.addLayer(marker);
    if (type === "cop")       copCluster.addLayer(marker);
  });

  uniCluster.addTo(map);
  workplaceCluster.addTo(map);
  clubCluster.addTo(map);
  copCluster.addTo(map);

  // 6. FILTER CONTROL
  L.control.layers(null, {
    "Universities": uniCluster,
    "Workplaces": workplaceCluster,
    "Clubs": clubCluster,
    "CoP Members": copCluster
  }).addTo(map);

  // -----------------------------------
  // 7. LGA SEARCH WITH DROPDOWN
  // -----------------------------------
  const input = document.getElementById("lgaSearch");

  // Create dropdown container
  const dropdown = document.createElement("div");
  dropdown.style.position = "absolute";
  dropdown.style.background = "white";
  dropdown.style.border = "1px solid #ccc";
  dropdown.style.width = "220px";
  dropdown.style.maxHeight = "200px";
  dropdown.style.overflowY = "auto";
  dropdown.style.display = "none";
  dropdown.style.zIndex = 99999;
  input.parentNode.appendChild(dropdown);

  input.addEventListener("input", () => {
    const q = input.value.toLowerCase().trim();
    dropdown.innerHTML = "";

    if (q.length < 2) {
      dropdown.style.display = "none";
      return;
    }

    const matches = Object.keys(lgaLayers).filter(name => name.includes(q));

    matches.forEach(name => {
      const item = document.createElement("div");
      item.style.padding = "5px";
      item.style.cursor = "pointer";
      item.innerText = name;
      item.onclick = () => {
        input.value = name;
        dropdown.style.display = "none";
        map.fitBounds(lgaLayers[name].getBounds(), { maxZoom: 10 });
      };
      dropdown.appendChild(item);
    });

    dropdown.style.display = matches.length ? "block" : "none";
  });

});

   // -----------------------------
    // 8. Add Legend
    // -----------------------------
    const legend = L.control({ position: "bottomright" });

    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");

      div.innerHTML = `
        <b>Legend</b><br>
        <div style="margin-top:8px;">
          <i style="background:#66b2ff; width:18px; height:18px;
                    float:left; margin-right:6px; border:1px solid #004c99;"></i>
          Welcoming Cities LGAs<br>
        </div>

        <div style="margin-top:8px; clear:both;">
          <i class="fa fa-university" style="color:#0066cc; margin-right:6px;"></i>
          University<br>
        </div>

        <div style="margin-top:8px;">
          <i class="fa fa-building" style="color:#2E8B57; margin-right:6px;"></i>
          Workplace<br>
        </div>

        <div style="margin-top:8px;">
          <i class="fa fa-flag" style="color:#800080; margin-right:6px;"></i>
          Club<br>
        </div>

        <div style="margin-top:8px;">
          <i class="fa fa-users" style="color:#ff8800; margin-right:6px;"></i>
          CoP Member<br>
        </div>
      `;
      return div;
    };

    legend.addTo(map);

  })
  .catch(err => {
    console.error("Error loading data:", err);
  });

</script>

</body>
</html>
