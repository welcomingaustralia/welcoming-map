<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcoming Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    .leaflet-control,
    .leaflet-popup-content {
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .searchBox {
      position: absolute;
      left: 10px;
      z-index: 10000;
      background: white;
      border-radius: 6px;
      border: 1px solid #ccc;
      padding: 8px 10px;
      font-size: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      width: min(340px, calc(100vw - 30px));
      box-sizing: border-box;
    }

    .searchBox input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 16px;
      box-sizing: border-box;
    }

    #lgaSearchBox {
      top: 10px;
      z-index: 30000;
    }

    #orgSearchBox {
      top: 62px;
      z-index: 10000;
    }

    .searchDropdown {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      width: 100%;
      max-height: 260px;
      overflow-y: auto;
      display: none;
      z-index: 20000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      box-sizing: border-box;
      left: 0;
      top: 42px;
    }

    .searchDropdown div {
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .searchDropdown div:hover {
      background: #f2f2f2;
    }

    .legend {
      background-color: white;
      padding: 15px;
      border: 2px solid #bbb;
      border-radius: 8px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      font-size: 14px;
      line-height: 1.4;
    }

    .legend i {
      min-width: 18px;
      text-align: center;
    }

    .leaflet-control-layers {
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      background: white;
      font-size: 14px;
    }
    
#mobileMenuButton,
#mobileMenuPanel {
  display: none;
}
    
    @media (max-width: 600px) {
      #lgaSearchBox,
      #orgSearchBox,
      .leaflet-control-layers {
        display: none;
      }
    
      #mobileMenuButton {
        display: block;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 50000;
        background: white;
        color: #000 !important;
        border: 1px solid #aaa;
        border-radius: 7px;
        padding: 10px 13px;
        font-size: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
    
      #mobileMenuPanel {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 60000;
        background: white;
        width: 74vw;
        max-width: 320px;
        height: 100vh;
        overflow-y: auto;
        padding: 14px;
        box-shadow: 3px 0 12px rgba(0,0,0,0.35);
        box-sizing: border-box;
      }
    
      #mobileMenuPanel.open {
        display: block;
      }
    
      #mobileMenuClose {
        float: right;
        font-size: 32px;
        background: none;
        border: none;
        cursor: pointer;
      }
    
      #mobileMenuPanel h3 {
        font-size: 18px;
        margin: 4px 0 20px 0;
        color: black !important;
      }
    
      .mobileMenuSection {
        margin-bottom: 16px;
      }
    
      .mobileMenuSection label {
        display: block;
        font-size: 15px;
        margin: 7px 0;
      }
    
      .mobileMenuSection input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        font-size: 16px;
        padding: 10px 12px;
        border: 1px solid #bbb;
        border-radius: 6px;
      }
    
      .mobileLayerToggle {
        transform: scale(1.3);
        margin-right: 10px;
      }
    
      .mobileDropdown {
        display: none;
        border: 1px solid #ccc;
        max-height: 260px;
        overflow-y: auto;
        margin-top: 6px;
        background: white;
      }
    
      .mobileDropdown div {
        padding: 10px 12px;
        font-size: 15px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
      }
    
      .legend {
        font-size: 11px;
        padding: 6px 8px;
        max-width: 155px;
        line-height: 1.25;
    }

      .legend i,
      .legend span {
          width: 9px !important;
          height: 9px !important;
          min-width: 9px !important;
          margin-right: 4px !important;
      }
      
      .leaflet-popup-content {
        font-size: 14px;
        line-height: 1.35;
        min-width: 210px;
        max-width: 260px;
      }
      
      .leaflet-popup-content h3 {
        font-size: 17px;
        margin-bottom: 6px;
      }
      
      .leaflet-popup-content p {
        margin: 3px 0 !important;
      }
      
      .leaflet-popup-content ul {
        margin-top: 3px !important;
      }
    }
  </style>
</head>

<body>

<div id="lgaSearchBox" class="searchBox">
  <input id="lgaSearch" type="text" placeholder="Search council area...">
</div>

<div id="orgSearchBox" class="searchBox">
  <input id="orgSearch" type="text" placeholder="Search organisation or postcode...">
</div>

<button id="mobileMenuButton">☰ Search & filters</button>

<div id="mobileMenuPanel">
  <button id="mobileMenuClose">×</button>
  <h3>Search & filters</h3>

  <div class="mobileMenuSection">
    <label for="mobileLgaSearch">Council area</label>
    <input id="mobileLgaSearch" type="text" placeholder="Search council area...">
    <div id="mobileLgaDropdown" class="mobileDropdown"></div>
  </div>

  <div class="mobileMenuSection">
    <label for="mobileOrgSearch">Organisation</label>
    <input id="mobileOrgSearch" type="text" placeholder="Search organisation...">
    <div id="mobileOrgDropdown" class="mobileDropdown"></div>
  </div>

  <div class="mobileMenuSection">
    <h4>Show initiatives</h4>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="uni" checked> Welcoming Universities</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="workplace" checked> Welcoming Workplaces</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="club" checked> Welcoming Clubs</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="cop" checked> Community Organisations</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="hub" checked> Community Hubs</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="crisp" checked> CRISP Settlements</label>
  </div>
</div>

  
<div id="map"></div>

<script>
const GEOJSON_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/LGA_2025_AUST_GDA2020.min.json";

const POINTS_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/main/welcoming_points_centroids.csv";

const WELC_LGAS_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/welcoming_lgas.csv";

const CRISP_LGA_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/crisp_lgas.csv";

const LGA_SUMMARY_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/lga_summary.csv";

const initialZoom = window.innerWidth <= 600 ? 3 : 5;
const map = L.map("map").setView([-25.0, 134.0], initialZoom);
map.zoomControl.setPosition("bottomleft");

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18
}).addTo(map);

const clusterOptions = {
  spiderfyOnMaxZoom: true,
  zoomToBoundsOnClick: true,
  maxClusterRadius: 50,
  disableClusteringAtZoom: 11
};

const uniCluster       = L.markerClusterGroup(clusterOptions);
const workplaceCluster = L.markerClusterGroup(clusterOptions);
const clubCluster      = L.markerClusterGroup(clusterOptions);
const copCluster       = L.markerClusterGroup(clusterOptions);
const hubCluster       = L.markerClusterGroup(clusterOptions);
const crispLayer       = L.layerGroup();

document.head.insertAdjacentHTML("beforeend", `
<style>
.marker-cluster-small,
.marker-cluster-medium,
.marker-cluster-large {
  background: #b0b0b0;
  color: #000000;
}
.marker-cluster-small div,
.marker-cluster-medium div,
.marker-cluster-large div {
  background: rgba(255,255,255,0.6);
}
</style>`);

function loadCSV(url) {
  return fetch(url)
    .then(r => r.text())
    .then(t => Papa.parse(t, { header: true, skipEmptyLines: true }).data);
}

function normaliseName(str) {
  return (str || "").trim().toLowerCase();
}

function publicLGAName(name) {
  if (name === "Unincorporated ACT") return "ACT";
  if (name === "Unincorporated NT") return "NT";
  return name;
}

function publicCountText(count) {
  return count < 5 ? "Less than 5" : count;
}

function crispRadius(count) {
  if (count < 5) return 8;
  return Math.max(10, Math.sqrt(count) * 5);
}

const lgaLayers = {};
const lgaCentres = {};
let selectedLGALayer = null;
const lgaSummaryLookup = {};
const initiativeCountsByLGA = {};
const accreditedOrgsByLGA = {};

Promise.all([
  loadCSV(WELC_LGAS_URL),
  fetch(GEOJSON_URL).then(r => r.json()),
  loadCSV(POINTS_URL),
  loadCSV(CRISP_LGA_URL),
  loadCSV(LGA_SUMMARY_URL)
])
.then(([welcList, geojson, points, crispData, lgaSummaryData]) => {

  const welcomingLGAs = new Set(
    welcList.map(r => r.lga_name?.trim()).filter(Boolean)
  );

  const palmAllianceLGAs = new Set([
    "Leeton",
    "Wagga Wagga",
    "Mount Isa",
    "Mareeba Shire",
    "Southern Downs",
    "Hinchinbrook",
    "Rockhampton",
    "Lockyer Valley",
    "Western Downs",
    "Banana",
    "South Burnett",
    "Cassowary Coast",
    "Greater Hume",
    "Griffith",
    "Berrigan",
    "Sunshine Coast",
    "Central Coast (Tas.)",
    "Toowoomba"
  ]);

  lgaSummaryData.forEach(row => {
    const key = normaliseName(row.lga_name);

    if (!key) return;

    lgaSummaryLookup[key] = row;
  });

  function lgaStyle(feature) {
    const name = feature.properties.LGA_NAME25;
    const isWelcoming = welcomingLGAs.has(name);
    const isPalm = palmAllianceLGAs.has(name);

    let style = isWelcoming
      ? { fillColor: "#CCA234", color: "#CCA234", weight: 1, fillOpacity: 0.50 }
      : { fillColor: "#f2f2f2", color: "#999", weight: 0.3, fillOpacity: 0.1 };

    if (isPalm) {
      style.color = "#EC6C5B";
      style.weight = 3;
      style.dashArray = "4 4";
    }

    return style;
  }

  function highlightLGA(layer) {
    if (selectedLGALayer) {
      selectedLGALayer.setStyle(lgaStyle(selectedLGALayer.feature));
    }

    selectedLGALayer = layer;

    layer.setStyle({
      color: "#666666",
      weight: 3,
      fillOpacity: 0.65
    });

    layer.bringToBack();
  }

  function showLGAPopup(rawName, layer) {
    const key = normaliseName(rawName);
    const profile = lgaSummaryLookup[key];

    if (!profile) return;

    const isWelcoming = welcomingLGAs.has(rawName);
    const isPalm = palmAllianceLGAs.has(rawName);

    const counts = initiativeCountsByLGA[key] || {
      uni: new Set(),
      workplace: new Set(),
      club: new Set(),
      cop: new Set(),
      hub: new Set()
    };

    const initiativeRows = [
      ["Welcoming Universities", counts.uni.size],
      ["Welcoming Workplaces", counts.workplace.size],
      ["Welcoming Clubs", counts.club.size],
      ["Community Organisations", counts.cop.size],
      ["Community Hubs", counts.hub.size]
    ].filter(row => row[1] > 0);

    const initiativeText = initiativeRows.length
      ? `
        <hr>
        <p style="margin:8px 0 4px 0;"><strong>Initiatives</strong></p>
        ${initiativeRows.map(row => `
          <p style="margin:4px 0;">${row[0]}: ${row[1]}</p>
        `).join("")}
      `
      : "";

    const accreditedOrgs = accreditedOrgsByLGA[key]
      ? Array.from(accreditedOrgsByLGA[key].values())
      : [];

    const membershipItems = [];

    if (isWelcoming) {
      membershipItems.push(
        `<p style="margin:6px 0;"><strong>Welcoming Cities Network Member</strong></p>`
      );
    }

    if (isPalm) {
      membershipItems.push(
        `<p style="margin:6px 0;"><strong>PALM Mayoral Alliance Member</strong></p>`
      );
    }

    const membershipText = membershipItems.join("");

    const accreditationText = profile.lga_accreditation?.trim()
      ? `<p style="margin:6px 0;"><strong>Welcoming City Accreditation:</strong> ${profile.lga_accreditation}</p>`
      : "";

    const accreditedOrgText = accreditedOrgs.length
      ? `
        <hr>
        <p style="margin:8px 0 4px 0;"><strong>Accredited Organisations</strong></p>
        <ul style="margin:4px 0 0 18px; padding:0;">
          ${accreditedOrgs.map(org => `
            <li>${org.name} (${org.level})</li>
          `).join("")}
        </ul>
      `
      : "";

    const popupContent = `
      <div style="min-width:240px;">
        <h3 style="margin:0 0 8px 0;">${rawName}</h3>

        ${membershipText}
        ${accreditationText}

        ${initiativeText}

        ${accreditedOrgText}

        <hr>

        <p style="margin:8px 0 4px 0;"><strong>Community Profile</strong></p>
        <p style="margin:4px 0;"><strong>Born overseas:</strong> ${profile.overseas_born_pct}%</p>
        <p style="margin:4px 0;"><strong>Language other than English:</strong> ${profile.language_other_than_english_pct}%</p>
      </div>
    `;

    layer.bindPopup(popupContent).openPopup();
  }

  L.geoJSON(geojson, {
    style: lgaStyle,
    onEachFeature: (feature, layer) => {
      const rawName = feature.properties.LGA_NAME25 || "";
      const key = normaliseName(rawName);
      const displayName = publicLGAName(rawName);

      lgaLayers[key] = { layer, displayName };

      const centre = layer.getBounds().getCenter();
      lgaCentres[key] = {
        lat: centre.lat,
        lon: centre.lng,
        displayName
      };

      layer.bindTooltip(displayName);

      layer.on("click", () => {
        highlightLGA(layer);
        showLGAPopup(rawName, layer);
      });
    }
  }).addTo(map);

  const circleColorMap = {
    uni: "#00AFC7",
    workplace: "#FD4731",
    club: "#BF824B",
    cop: "#ff8800",
    hub: "#02006C"
  };

  points.forEach(r => {
    if (!r.lat || !r.lon) return;

    const type = r.type?.trim().toLowerCase();
    if (type === "crisp") return;

    const lgaKey = normaliseName(r.lga_name);
    const institutionId = r.institution_id?.trim();
    const accreditationLevel = r.accreditation_level?.trim();

    if (lgaKey && institutionId) {
      if (!initiativeCountsByLGA[lgaKey]) {
        initiativeCountsByLGA[lgaKey] = {
          uni: new Set(),
          workplace: new Set(),
          club: new Set(),
          cop: new Set(),
          hub: new Set()
        };
      }

      if (initiativeCountsByLGA[lgaKey][type]) {
      initiativeCountsByLGA[lgaKey][type].add(institutionId);
      }

      if (accreditationLevel) {
        if (!accreditedOrgsByLGA[lgaKey]) {
          accreditedOrgsByLGA[lgaKey] = new Map();
        }

        accreditedOrgsByLGA[lgaKey].set(institutionId, {
          name: r.name,
          level: accreditationLevel
        });
      }
    }

    const markerColor = circleColorMap[type] || "#444";

    const jitterLat = (Math.random() - 0.5) * 0.0015;
    const jitterLon = (Math.random() - 0.5) * 0.0015;

    const marker = L.circleMarker([+r.lat + jitterLat, +r.lon + jitterLon], {
      radius: 7,
      color: markerColor,
      fillColor: markerColor,
      fillOpacity: 0.75,
      weight: 2,
      title: r.name,
      postcode: r.postcode
    });

    marker.bindTooltip(r.name, {
      direction: "top",
      offset: [0, -10],
      opacity: 0.9
    });

    marker.bindPopup(`
      <b>${r.name}</b><br>
      ${r.address || ""}<br>
      ${r.postcode || ""}
    `);

    if (type === "uni")       uniCluster.addLayer(marker);
    if (type === "workplace") workplaceCluster.addLayer(marker);
    if (type === "club")      clubCluster.addLayer(marker);
    if (type === "cop")       copCluster.addLayer(marker);
    if (type === "hub")       hubCluster.addLayer(marker);
  });

  crispData.forEach(row => {
    const rawLGAName = row.lga_name?.trim();
    const count = Number(row.count);

    if (!rawLGAName || !count) return;

    const key = normaliseName(rawLGAName);
    const centre = lgaCentres[key];

    if (!centre) {
      console.warn("CRISP LGA not found in GeoJSON:", rawLGAName);
      return;
    }

    const displayCount = publicCountText(count);
    const displayName = publicLGAName(centre.displayName);

    const circle = L.circleMarker([centre.lat, centre.lon], {
      radius: crispRadius(count),
      color: "#d98ca3",
      fillColor: "#d98ca3",
      fillOpacity: 0.55,
      weight: 2
    });

    circle.bindTooltip(`${displayName}: ${displayCount} people settled`, {
      direction: "top",
      opacity: 0.9
    });

    circle.bindPopup(`
      <b>${displayName}</b><br>
      ${displayCount} people settled through CRISP
    `);

    crispLayer.addLayer(circle);
  });

  uniCluster.addTo(map);
  workplaceCluster.addTo(map);
  clubCluster.addTo(map);
  copCluster.addTo(map);
  hubCluster.addTo(map);
  crispLayer.addTo(map);

  function applyJitterToMarkers(clusterGroup) {
    clusterGroup.eachLayer(marker => {
      if (!marker.originalLatLng) {
        marker.originalLatLng = marker.getLatLng();
      }

      if (map.getZoom() >= clusterGroup.options.disableClusteringAtZoom) {
        const jitterLat = (Math.random() - 0.5) * 0.0010;
        const jitterLon = (Math.random() - 0.5) * 0.0010;

        marker.setLatLng([
          marker.originalLatLng.lat + jitterLat,
          marker.originalLatLng.lng + jitterLon
        ]);
      } else {
        marker.setLatLng(marker.originalLatLng);
      }
    });
  }

  map.on("zoomend", () => {
    applyJitterToMarkers(uniCluster);
    applyJitterToMarkers(workplaceCluster);
    applyJitterToMarkers(clubCluster);
    applyJitterToMarkers(copCluster);
    applyJitterToMarkers(hubCluster);
  });

  const orgInput = document.getElementById("orgSearch");
  const allMarkers = [];

  function collectMarkers(clusterGroup) {
    clusterGroup.eachLayer(marker => allMarkers.push(marker));
  }

  collectMarkers(uniCluster);
  collectMarkers(workplaceCluster);
  collectMarkers(clubCluster);
  collectMarkers(copCluster);
  collectMarkers(hubCluster);

  const orgDropdown = document.createElement("div");
  orgDropdown.className = "searchDropdown";
  orgDropdown.style.zIndex = "20000";
  orgInput.parentNode.appendChild(orgDropdown);

  orgInput.addEventListener("input", () => {
    const q = orgInput.value.toLowerCase().trim();
    orgDropdown.innerHTML = "";

    if (q.length < 2) {
      orgDropdown.style.display = "none";
      return;
    }

    const matches = allMarkers.filter(marker => {
      const name = marker.options.title?.toLowerCase() || "";
      const pc = marker.options.postcode?.toString() || "";
      return name.includes(q) || pc.includes(q);
    });

    matches.forEach(marker => {
      const item = document.createElement("div");
      item.innerText = `${marker.options.title} (${marker.options.postcode || ""})`;

      item.onclick = () => {
        orgInput.value = marker.options.title;
        orgDropdown.style.display = "none";
        map.setView(marker.getLatLng(), 12);
        marker.openPopup();
      };

      orgDropdown.appendChild(item);
    });

    orgDropdown.style.display = matches.length ? "block" : "none";
  });

  L.control.layers(
    null,
    {
      "Welcoming Universities": uniCluster,
      "Welcoming Workplaces": workplaceCluster,
      "Welcoming Clubs": clubCluster,
      "Community Organisations": copCluster,
      "Community Hubs": hubCluster,
      "CRISP Settlements": crispLayer
    },
    { collapsed: false }
  ).addTo(map);

  const legend = L.control({ position: "bottomright" });

  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "legend");
    div.innerHTML = `
      <i style="background:#CCA234; width:14px; height:14px; display:inline-block; border:1px solid #CCA234; margin-right:6px;"></i>
        Welcoming Cities<br>
      <i style="border:2px dashed #e67373; width:14px; height:14px; display:inline-block; margin-right:6px;"></i>
        PALM Mayoral Alliance<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#00AFC7; opacity:0.75; margin-right:6px;"></span>
  Welcoming Universities<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#FD4731; opacity:0.75; margin-right:6px;"></span>
  Welcoming Workplaces<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#BF824B; opacity:0.75; margin-right:6px;"></span>
  Welcoming Clubs<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#ff8800; opacity:0.75; margin-right:6px;"></span>
  Community Organisations<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#02006C; opacity:0.75; margin-right:6px;"></span>
  Community Hubs<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#d98ca3; opacity:0.75; margin-right:6px;"></span>
        CRISP Settlements<br>
    `;
    return div;
  };

  legend.addTo(map);

  const mobileMenuButton = document.getElementById("mobileMenuButton");
  const mobileMenuPanel = document.getElementById("mobileMenuPanel");
  const mobileMenuClose = document.getElementById("mobileMenuClose");
  
  mobileMenuButton.addEventListener("click", () => {
    mobileMenuPanel.classList.add("open");
  });
  
  mobileMenuClose.addEventListener("click", () => {
    mobileMenuPanel.classList.remove("open");
  });

  const mobileLayerMap = {
    uni: uniCluster,
    workplace: workplaceCluster,
    club: clubCluster,
    cop: copCluster,
    hub: hubCluster,
    crisp: crispLayer
  };
  
  document.querySelectorAll(".mobileLayerToggle").forEach(toggle => {
    toggle.addEventListener("change", () => {
      const layer = mobileLayerMap[toggle.dataset.layer];
  
      if (!layer) return;
  
      if (toggle.checked) {
        map.addLayer(layer);
      } else {
        map.removeLayer(layer);
      }
    });
  });

  const input = document.getElementById("lgaSearch");

  const dropdown = document.createElement("div");
  dropdown.className = "searchDropdown";
  dropdown.style.zIndex = "50000";
  input.parentNode.appendChild(dropdown);

  input.addEventListener("input", () => {
    const q = input.value.toLowerCase().trim();
    dropdown.innerHTML = "";

    if (q.length < 2) {
      dropdown.style.display = "none";
      return;
    }

    const matches = Object.keys(lgaLayers).filter(name => name.includes(q));

    matches.forEach(nameKey => {
      const info = lgaLayers[nameKey];
      const item = document.createElement("div");
      item.innerText = info.displayName;

      item.onclick = () => {
        input.value = info.displayName;
        dropdown.style.display = "none";
        map.fitBounds(info.layer.getBounds(), {
          maxZoom: 9,
          paddingTopLeft: [20, 150],
          paddingBottomRight: [20, 80]
        });
        highlightLGA(info.layer);
        showLGAPopup(info.displayName, info.layer);
      };

      dropdown.appendChild(item);
    });

    dropdown.style.display = matches.length ? "block" : "none";
  });

  const mobileLgaInput = document.getElementById("mobileLgaSearch");
const mobileLgaDropdown = document.getElementById("mobileLgaDropdown");

mobileLgaInput.addEventListener("input", () => {
  const q = mobileLgaInput.value.toLowerCase().trim();
  mobileLgaDropdown.innerHTML = "";

  if (q.length < 2) {
    mobileLgaDropdown.style.display = "none";
    return;
  }

  const matches = Object.keys(lgaLayers).filter(name => name.includes(q));

  matches.forEach(nameKey => {
    const info = lgaLayers[nameKey];
    const item = document.createElement("div");
    item.innerText = info.displayName;

    item.onclick = () => {
      mobileLgaInput.value = info.displayName;
      mobileLgaDropdown.style.display = "none";
      mobileMenuPanel.classList.remove("open");

      const centre = info.layer.getBounds().getCenter();
      map.setView(centre, 8);

      highlightLGA(info.layer);
      showLGAPopup(info.displayName, info.layer);
    };

    mobileLgaDropdown.appendChild(item);
  });

  mobileLgaDropdown.style.display = matches.length ? "block" : "none";
});


const mobileOrgInput = document.getElementById("mobileOrgSearch");
const mobileOrgDropdown = document.getElementById("mobileOrgDropdown");

mobileOrgInput.addEventListener("input", () => {
  const q = mobileOrgInput.value.toLowerCase().trim();
  mobileOrgDropdown.innerHTML = "";

  if (q.length < 2) {
    mobileOrgDropdown.style.display = "none";
    return;
  }

  const matches = allMarkers.filter(marker => {
    const name = marker.options.title?.toLowerCase() || "";
    const pc = marker.options.postcode?.toString() || "";
    return name.includes(q) || pc.includes(q);
  });

  matches.forEach(marker => {
    const item = document.createElement("div");
    item.innerText = `${marker.options.title} (${marker.options.postcode || ""})`;

    item.onclick = () => {
      mobileOrgInput.value = marker.options.title;
      mobileOrgDropdown.style.display = "none";
      mobileMenuPanel.classList.remove("open");

      map.setView(marker.getLatLng(), 12);
      marker.openPopup();
    };

    mobileOrgDropdown.appendChild(item);
  });

  mobileOrgDropdown.style.display = matches.length ? "block" : "none";
});

  
})
.catch(error => {
  console.error("Map data failed to load:", error);
});
</script>
